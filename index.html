<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E2A55"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CAPAS">
<meta name="description" content="CAPAS · el centro que no se ve. Recorrido de realidad aumentada por Plaza Botero, Museo de Antioquia y Palacio de la Cultura.">
<title>CAPAS Medellín</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">

<style>@font-face{font-family:'Kaushan Script';font-weight:400;font-display:swap;src:url(fonts/kaushan-script-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-weight:300;font-display:swap;src:url(fonts/montserrat-latin-300-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-weight:400;font-display:swap;src:url(fonts/montserrat-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-weight:500;font-display:swap;src:url(fonts/montserrat-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-weight:800;font-display:swap;src:url(fonts/montserrat-latin-800-normal.woff2) format('woff2')}:root{
  --blue:#176FF2; --blue-d:#0F5BD1; --blue-l:#EAF2FE; --sky:#F3F8FE;
  --ink:#1B1E28; --ink2:#3C4250; --muted:#7D848D; --line:#E6E9EE;
  --white:#FFFFFF; --bg:#FFFFFF; --amber:#F2A93B; --green:#2DD7A4; --red:#FF5A5F;
  --seal-arch:#176FF2; --seal-recon:#C9822A; --seal-interp:#8A5CD1; --seal-sound:#12A39A;
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 12px 32px rgba(23,111,242,.12); --shadow2:0 6px 18px rgba(16,24,40,.10);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color-scheme:light;background:var(--bg);color:var(--ink);font-family:'Montserrat',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body.dark{background:#000}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{position:relative;max-width:480px;margin:0 auto;height:100%;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fadeIn .3s ease}
.screen>*,.home>*,.panel>*{flex-shrink:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:0 20px}
.h-script{font-family:'Kaushan Script',cursive;font-weight:400;letter-spacing:.5px}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.h1{font-size:32px;font-weight:500;margin:2px 0 0;letter-spacing:-.3px}
.h2{font-size:20px;font-weight:600;margin:0}
.h3{font-size:16px;font-weight:600;margin:0}
.body{font-size:14px;line-height:1.55;color:var(--ink2)}
.small{font-size:12px;line-height:1.45;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:var(--r-md);background:var(--blue);color:#fff;font-weight:700;font-size:16px;width:100%;box-shadow:0 10px 24px rgba(23,111,242,.35);transition:transform .12s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;box-shadow:none}
.btn svg{width:22px;height:22px}
.btn.ghost{background:var(--blue-l);color:var(--blue);box-shadow:none}
.btn.light{background:rgba(255,255,255,.18);color:#fff;box-shadow:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn.sm{height:44px;font-size:14px;border-radius:14px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.9);color:var(--ink);box-shadow:var(--shadow2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.dark{background:rgba(20,24,34,.55);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.pill.on{background:var(--blue-l);color:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:rgba(29,29,29,.55);color:#fff;font-size:11.5px;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip svg{width:14px;height:14px}

/* Welcome (como la portada de Aspen) */
.welcome{background:#0E2A55;color:#fff}
.welcome .art{position:absolute;inset:0}
.welcome .art svg{width:100%;height:100%}
.welcome .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,38,.15) 0%,rgba(6,16,38,0) 35%,rgba(6,16,38,.55) 70%,rgba(6,16,38,.9) 100%)}
.welcome .content{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:calc(20px + var(--safe-t)) 28px calc(28px + var(--safe-b))}
.welcome .logo{font-size:96px;line-height:1;margin-top:40px;text-align:center;text-shadow:0 6px 30px rgba(0,0,0,.35)}
.welcome .tag{text-align:center;font-size:15px;letter-spacing:3px;text-transform:uppercase;opacity:.9;margin-top:6px}
.welcome .lead{font-size:30px;font-weight:300;line-height:1.15;margin:auto 0 10px}
.welcome .lead b{font-weight:600}
.welcome .sub{font-size:14px;line-height:1.5;opacity:.88;margin-bottom:22px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:12px;padding:4px}
.lang span{padding:6px 10px;border-radius:9px;font-size:12px;font-weight:700}
.lang .on{background:#fff;color:var(--ink)}
.lang .off{opacity:.6}

/* Paneles de onboarding */
.panel{padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b));display:flex;flex-direction:column;min-height:100%}
.panel .illus{margin:14px auto;width:120px;height:120px;border-radius:50%;background:var(--sky);display:grid;place-items:center}
.rules{list-style:none;padding:0;margin:8px 0 24px;counter-reset:r}
.rules li{counter-increment:r;position:relative;padding:14px 14px 14px 52px;margin-bottom:10px;border-radius:var(--r-md);background:var(--sky);font-size:14px;line-height:1.45;color:var(--ink2)}
.rules li::before{content:counter(r);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:9px;background:var(--blue);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.mode-card{display:block;width:100%;text-align:left;border-radius:var(--r-lg);padding:20px;margin-bottom:14px;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow2)}
.mode-card.rec{border-color:var(--blue)}
.mode-card .row{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.mode-card .ic{width:44px;height:44px;border-radius:14px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center}
.mode-card .ic svg{width:24px;height:24px}
.mode-card[disabled]{opacity:.5}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:8px;background:var(--blue);color:#fff;margin-left:6px;vertical-align:middle}

/* Home (pantalla Explora) */
.home{padding-bottom:calc(96px + var(--safe-b))}
.home header{display:flex;justify-content:space-between;align-items:flex-start;padding:calc(18px + var(--safe-t)) 20px 0}
.loc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}
.loc svg{width:16px;height:16px;color:var(--blue)}
.progress-box{margin:20px 20px 0;padding:14px 16px;border-radius:var(--r-lg);background:var(--sky);display:flex;align-items:center;gap:14px}
.progress-box .dots{display:flex;gap:6px}
.progress-box .dot{width:34px;height:8px;border-radius:6px;background:#D6E4F8}
.progress-box .dot.on{background:var(--blue)}
.pills{display:flex;gap:6px;overflow-x:auto;padding:18px 20px 4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px 12px}
.sec-head a,.link{color:var(--blue);font-size:12.5px;font-weight:600}
.cards-h{display:flex;gap:16px;overflow-x:auto;padding:4px 20px 18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.cards-h::-webkit-scrollbar{display:none}
.card-v{position:relative;flex:0 0 200px;height:250px;border-radius:24px;overflow:hidden;scroll-snap-align:start;box-shadow:var(--shadow);text-align:left}
.card-v .art,.card-v img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-v .art svg{width:100%;height:100%}
.card-v .tags{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.card-v .state{position:absolute;right:12px;bottom:12px;width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--blue)}
.card-v .state svg{width:16px;height:16px}
.card-v .num{position:absolute;left:12px;top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px}
.card-s{border-radius:18px;background:#fff;box-shadow:var(--shadow2);padding:4px;text-align:left;position:relative}
.card-s .thumb{height:92px;border-radius:14px;overflow:hidden;position:relative;display:grid;place-items:center}
.card-s .thumb .art{position:absolute;inset:0}.card-s .thumb .art svg{width:100%;height:100%}.card-s .thumb .mono{position:relative;z-index:1;background:rgba(255,255,255,.85);padding:4px 8px;border-radius:8px;font-size:12px!important;color:var(--ink)!important}
.card-s .thumb .tag{position:absolute;right:6px;bottom:6px;font-size:10px;font-weight:700;color:#fff;background:#3A544F;padding:3px 7px;border-radius:8px}
.card-s .t{font-size:13.5px;font-weight:600;padding:8px 6px 2px}
.card-s .m{font-size:11px;color:var(--muted);padding:0 6px 8px;display:flex;gap:4px;align-items:center}
.card-s.locked{opacity:.55}
.thumb.c-pb{background:linear-gradient(135deg,#FCE6CF,#F6C9A0)}
.thumb.c-ma{background:linear-gradient(135deg,#F5D6C8,#E6A98F)}
.thumb.c-pc{background:linear-gradient(135deg,#DCE6F5,#AFC4E6)}
.thumb .mono{font-size:22px;font-weight:700;color:rgba(27,30,40,.55)}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(72px + var(--safe-b));padding-bottom:var(--safe-b);background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(16,24,40,.06);display:flex;justify-content:space-around;align-items:center;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#B8BEC7;font-size:10.5px;font-weight:600;width:64px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--blue)}

/* Detalle de parada (como pantalla 3 de Aspen) */
.detail{padding:calc(14px + var(--safe-t)) 20px calc(24px + var(--safe-b))}
.detail .hero{position:relative;height:360px;border-radius:24px;box-shadow:var(--shadow)}
.detail .hero .art,.detail .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:24px;overflow:hidden}
.detail .hero .art svg{width:100%;height:100%}
.detail .hero .icon-btn{position:absolute;left:14px;top:14px}
.detail .hero .ill{position:absolute;right:12px;top:16px}
.detail .layer-badge{position:absolute;right:16px;bottom:-1px;transform:translateY(50%);width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:var(--shadow2);display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:18px}
.detail .title-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}
.detail .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:6px 0 14px}
.detail .meta svg{width:16px;height:16px;color:var(--amber)}
.facilities{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 20px}
.facility{border-radius:16px;background:var(--sky);height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#A6B4C8;font-size:10.5px;font-weight:600}
.facility svg{width:28px;height:28px;color:#8FA3BF}
.cta-row{display:flex;align-items:center;gap:18px;margin-top:auto;padding-top:8px}
.cta-row .price small{display:block;font-size:12px;font-weight:600;color:var(--ink2)}
.cta-row .price b{font-size:24px;color:var(--green);font-weight:700}
.cta-row .btn{flex:1}

/* Escena (cámara + capas) */
.scene{background:#0B0F17;color:#fff}
.scene .stage{position:absolute;inset:0;overflow:hidden}
.scene video,.scene .bg2d{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene .bg2d svg{width:100%;height:100%}
.scene .vignette{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%);pointer-events:none}
.scene .hud{position:absolute;left:0;right:0;top:0;padding:calc(12px + var(--safe-t)) 16px 0;display:flex;align-items:center;gap:10px;z-index:5}
.scene .hud{gap:8px!important}.scene .hud .icon-btn{width:40px;height:40px;flex:0 0 40px}
.scene .hud .where{flex:1;min-width:0;font-size:11.5px;font-weight:600;line-height:1.3;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.scene .hud .where b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene .hud .exit-txt{width:auto;padding:0 12px;font-size:12px;font-weight:700;gap:6px;display:flex}
.seal{position:absolute;left:16px;top:calc(62px + var(--safe-t));z-index:5;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:800;letter-spacing:.6px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.seal::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff}
.seal-arch{background:var(--seal-arch)}.seal-recon{background:var(--seal-recon)}.seal-interp{background:var(--seal-interp)}.seal-sound{background:var(--seal-sound)}
.seal small{font-weight:600;letter-spacing:0;opacity:.9}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:16px 16px calc(16px + var(--safe-b));background:#fff;color:var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);max-height:46%;overflow-y:auto;animation:up .3s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:#D9DDE3;margin:0 auto 12px}
.sheet .step{font-size:11.5px;font-weight:700;color:var(--blue);letter-spacing:.3px;text-transform:uppercase}
.sheet .h2{margin:4px 0 8px}
.caption{margin:10px 0;padding:12px 14px;border-radius:14px;background:var(--sky);font-size:13.5px;line-height:1.5;color:var(--ink2);position:relative}
.caption .who{display:block;font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--blue);margin-bottom:3px;text-transform:uppercase}
.src{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}
.row-btns{display:flex;gap:10px;margin-top:12px}
.row-btns .btn{flex:1}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:16px;border:2px solid var(--line);margin-top:10px;background:#fff;font-size:14px;font-weight:600;color:var(--ink)}
.opt .mini{width:72px;height:54px;border-radius:10px;overflow:hidden;flex:0 0 72px;background:var(--sky)}
.opt .mini svg{width:100%;height:100%}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.opt.good{border-color:var(--green);background:#E8FBF4}
.opt.bad{border-color:#F3B9BB;background:#FFF2F2}
.opt.dim{opacity:.45}
.fb{margin-top:10px;font-weight:700;font-size:14px}
.fb.good{color:#0E9B70}.fb.bad{color:#D0454A}

/* alineación */
.contour{position:absolute;left:6%;right:6%;top:12%;height:34%;z-index:3;pointer-events:none}
.contour svg{width:100%;height:100%}
.contour-path{stroke:var(--amber);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw .8s ease forwards;filter:drop-shadow(0 0 6px rgba(242,169,59,.6))}
.contour.solid .contour-path{stroke-width:4.4;stroke:#FFC060}
.contour.lost{opacity:.35}
@keyframes draw{to{stroke-dashoffset:0}}
.align-meter{position:absolute;left:50%;top:calc(47% - 4px);transform:translateX(-50%);z-index:5;font-size:12.5px;font-weight:700;background:rgba(0,0,0,.5);padding:7px 12px;border-radius:12px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.align-meter .bar{width:60px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.align-meter .bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .15s}
.align-meter.ok{background:rgba(45,215,164,.85);color:#06281D}

/* capa de archivo superpuesta */
.archive-layer{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .08s linear;pointer-events:none}
.archive-layer img{width:100%;height:100%;object-fit:cover;filter:sepia(.25)}
.pending{position:absolute;left:6%;right:6%;top:12%;height:34%;border-radius:20px;border:2px dashed rgba(255,255,255,.75);background:repeating-linear-gradient(135deg,rgba(120,88,52,.82) 0 14px,rgba(140,104,64,.82) 14px 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:8px}
.pending svg{width:36px;height:36px;opacity:.9}
.pending b{font-size:13px}
.pending span{font-size:11.5px;opacity:.9;line-height:1.4}
.year-tag{position:absolute;left:50%;transform:translateX(-50%);top:calc(47% - 2px);z-index:5;background:rgba(0,0,0,.6);padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;animation:fadeIn .3s}

/* deslizador del tiempo */
.timeslider{margin:12px 0 4px}
.timeslider .labels{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.5px;margin-bottom:6px}
.timeslider .labels span.on{color:var(--blue)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:5px;background:linear-gradient(90deg,var(--blue) var(--p,0%),#E3E8F0 var(--p,0%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 3px 10px rgba(23,111,242,.35)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--blue)}

/* hotspots */
.hotspot{position:absolute;z-index:4;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(242,169,59,.95);box-shadow:0 0 0 0 rgba(242,169,59,.7);animation:pulse 1.6s infinite;display:grid;place-items:center;color:#2b1a00;font-weight:800}
.hotspot.seen{background:rgba(45,215,164,.95);animation:none}
.hotspot svg{width:16px;height:16px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,169,59,.7)}70%{box-shadow:0 0 0 16px rgba(242,169,59,0)}100%{box-shadow:0 0 0 0 rgba(242,169,59,0)}}
.bubble{position:absolute;z-index:6;left:8%;right:8%;background:#fff;color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow2);font-size:13.5px;line-height:1.45;animation:fadeIn .2s}
.bubble b{display:block;margin-bottom:2px}

/* contador PB-03 */
.plan{position:relative;margin:8px 0;border-radius:16px;background:#F4F1EB;height:150px;overflow:hidden}
.plan .note{position:absolute;left:10px;top:8px;font-size:10px;font-weight:700;color:#9A8E7B;letter-spacing:.4px}
.plan i{position:absolute;width:12px;height:12px;border-radius:50%;background:#CFC6B8;transition:background .2s,transform .2s}
.plan i.on{background:var(--amber);transform:scale(1.15);box-shadow:0 0 0 4px rgba(242,169,59,.25)}
.counter-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.odometer{font-size:44px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.odometer small{font-size:13px;color:var(--muted);font-weight:600;margin-left:6px}
.plus{width:64px;height:64px;border-radius:20px;background:var(--blue);color:#fff;font-size:34px;font-weight:500;box-shadow:0 10px 24px rgba(23,111,242,.35)}
.plus.pulse{animation:pulse 1.6s infinite}
.quote{border-left:4px solid var(--blue);padding:10px 14px;margin:12px 0;background:var(--sky);border-radius:0 14px 14px 0;font-style:italic;font-size:14px;line-height:1.5}
.quote small{display:block;font-style:normal;color:var(--muted);margin-top:6px;font-size:11.5px}

/* orden MA-03 */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.slot{min-height:96px;border-radius:14px;border:2px dashed #C9D6EA;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;background:var(--sky)}
.slot .y{font-weight:800;font-size:13px;color:var(--blue)}
.slot.ready{border-color:var(--blue);background:var(--blue-l)}
.slot .placed{font-size:10.5px;line-height:1.3;font-weight:600;text-align:center;background:#fff;border-radius:10px;padding:6px;box-shadow:var(--shadow2);border:2px solid var(--green)}
.slot.shake{animation:shake .25s 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cardsel{display:flex;flex-direction:column;gap:8px}
.cardsel button{padding:12px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:13.5px;font-weight:600;text-align:left;touch-action:none}
.cardsel button.picked{border-color:var(--blue);background:var(--blue-l)}
.cardsel button.used{display:none}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;padding:10px 12px;border-radius:12px;background:#fff;border:2px solid var(--blue);font-size:12px;font-weight:600;box-shadow:var(--shadow);max-width:200px}

/* cúpula PC-02 */
.dome-wrap{position:relative;margin:8px 0;border-radius:16px;background:#F5F7FA;padding:8px}
.dome-svg{width:100%;height:auto;display:block}
.dome-svg .built{fill:var(--amber);fill-opacity:.85;stroke:#B97614;stroke-width:2}
.dome-svg .ghost{fill:#fff;fill-opacity:.0;stroke:#9AA6B6;stroke-width:2;stroke-dasharray:6 5;opacity:0;transition:opacity .2s}
.dome-svg .ghost.on{opacity:1;fill-opacity:.6}
.dome-svg .dome{fill:#7A3B2E;stroke:#fff;stroke-width:3;transition:transform .3s}
.dome-svg .axis{stroke-width:2;stroke-dasharray:4 4;opacity:0;transition:opacity .3s}
.dome-svg .axis-built{stroke:#1B1E28}.dome-svg .axis-dome{stroke:#7A3B2E}
.dome-svg.lines .axis{opacity:1}
.dome-svg .lbl{font-size:9px;fill:var(--muted);text-anchor:middle}
.handle{display:flex;align-items:center;gap:10px;margin-top:8px}
.stamp{display:inline-block;margin-top:10px;padding:8px 12px;border-radius:10px;background:#1B1E28;color:#fff;font-weight:800;font-size:13px;letter-spacing:.3px}

/* lupa PC-03 */
.lens{position:absolute;width:150px;height:150px;border-radius:50%;border:4px solid var(--amber);overflow:hidden;z-index:4;box-shadow:0 8px 30px rgba(0,0,0,.4);touch-action:none;left:calc(50% - 75px);top:28%}
.lens video,.lens .lens-bg{position:absolute;width:300%;height:300%;object-fit:cover;left:-100%;top:-100%}
.lens .tex{position:absolute;inset:0;opacity:0;transition:opacity .3s}
.lens .tex.on{opacity:1}
.tex-stone{background:repeating-linear-gradient(0deg,#B9B2A6 0 18px,#8E877B 18px 20px),repeating-linear-gradient(90deg,transparent 0 34px,#8E877B 34px 36px);background-blend-mode:multiply}
.tex-plaster{background:conic-gradient(#ECE8E1 0 25%,#5E6670 0 50%,#ECE8E1 0 75%,#5E6670 0) 0 0/36px 36px}

/* huella */
.huella-card{position:relative;margin:6px 0 12px;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,#176FF2,#5AA0FF);box-shadow:var(--shadow);overflow:hidden}
.huella-card::after{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.huella-card .k{font-size:11px;font-weight:800;letter-spacing:.8px;opacity:.9}
.huella-card .y{font-size:26px;font-weight:700;margin:4px 0 6px}
.huella-card p{margin:0;font-size:14px;line-height:1.5}
.huella-card .ev{font-size:11px;opacity:.85;margin-top:10px}
.huella-card.fly{animation:fly .6s ease forwards}
@keyframes fly{to{transform:translate(40%,120%) scale(.2);opacity:0}}
.fan{position:relative;height:190px;margin:8px 0}
.fan .layer{position:absolute;left:8%;right:8%;height:120px;border-radius:20px;padding:14px;color:#fff;box-shadow:var(--shadow);transition:transform .5s ease}
.fan .l1{background:linear-gradient(135deg,#176FF2,#5AA0FF);top:0;z-index:3}
.fan .l2{background:linear-gradient(135deg,#C9822A,#F2A93B);top:30px;z-index:2}
.fan .l3{background:linear-gradient(135deg,#2C3442,#59647A);top:60px;z-index:1}
.fan.open .l1{transform:translate(-14px,-6px) rotate(-6deg)}
.fan.open .l3{transform:translate(14px,10px) rotate(6deg)}
.fan .layer b{display:block;font-size:12px;letter-spacing:.6px}
.fan .layer span{font-size:20px;font-weight:700}

/* Micro */
.micro-art{height:200px;border-radius:20px;overflow:hidden;display:grid;place-items:center;margin-bottom:14px;position:relative}
.micro-art .big{font-size:56px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
.micro-art .seal{left:10px;top:10px}
.cab-svg{height:190px}
.cab-svg .shelf{cursor:pointer}
.cab-svg .shelf.on rect:first-child{stroke:var(--blue);stroke-width:3}
.fence{background:linear-gradient(180deg,#EEF4FD,#DCE8FA)}
.fence::before{content:'';position:absolute;left:8%;right:8%;top:45%;height:36px;background:repeating-linear-gradient(90deg,#7D848D 0 4px,transparent 4px 26px),linear-gradient(#7D848D,#7D848D) 0 4px/100% 3px no-repeat,linear-gradient(#7D848D,#7D848D) 0 28px/100% 3px no-repeat;opacity:.55}

/* traslado y mapa */
.mapbox{position:relative;border-radius:22px;background:#EEF4FD;height:280px;overflow:hidden;margin:12px 0}
.mapbox svg{width:100%;height:100%}

/* Quiz */
.quiz{padding:calc(16px + var(--safe-t)) 20px calc(24px + var(--safe-b))}
.qprog{display:flex;gap:4px;margin:10px 0 18px}
.qprog i{flex:1;height:5px;border-radius:3px;background:#E3E8F0}
.qprog i.on{background:var(--blue)}
.qprog i.ok{background:var(--green)}
.qprog i.ko{background:#F3B9BB}
.score{font-size:64px;font-weight:700;color:var(--blue);line-height:1}
.learned{list-style:none;padding:0;margin:14px 0}
.learned li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.learned li svg{flex:0 0 20px;width:20px;height:20px;color:var(--green)}

/* toasts / misc */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:#1B1E28;color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;z-index:200;max-width:88%;box-shadow:var(--shadow);animation:fadeIn .2s}
.pause-veil{position:absolute;inset:0;z-index:50;background:rgba(10,14,22,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.list-src{padding-left:18px;font-size:12.5px;line-height:1.5;color:var(--ink2)}
.list-src li{margin-bottom:8px}
.list-src a{color:var(--blue);word-break:break-word}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.panel>.btn:last-child{position:sticky;bottom:calc(12px + var(--safe-b));z-index:3}
</style></head>
<body><main id="app" aria-live="polite"></main>
<script src="content.js"></script><script>/* Ilustraciones propias (SVG). No reproducen fotos ni obras protegidas:
   son esquemas libres de los edificios, marcados como ilustración. */
const ART = (() => {
  const sky = (id, a, b, c) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs>`;
  const mountains = (y, col, op = 1) => `<path d="M0 ${y} L40 ${y - 38} L85 ${y - 20} L130 ${y - 62} L180 ${y - 30} L230 ${y - 70} L285 ${y - 34} L330 ${y - 58} L400 ${y - 24} L400 300 L0 300Z" fill="${col}" opacity="${op}"/>`;

  function museo(x = 70, y = 120, s = 1, brick = '#B7643F', dark = '#7E3F26') {
    // Bloque de ladrillo, cuerpo central escalonado, pilastras verticales (lenguaje art déco)
    let g = `<g transform="translate(${x} ${y}) scale(${s})">`;
    g += `<rect x="0" y="40" width="260" height="120" fill="${brick}"/>`;
    g += `<rect x="85" y="10" width="90" height="150" fill="${brick}"/>`;
    g += `<rect x="105" y="0" width="50" height="20" fill="${dark}"/>`;
    for (let i = 0; i < 6; i++) g += `<rect x="${92 + i * 14}" y="20" width="4" height="140" fill="${dark}" opacity=".55"/>`;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
      g += `<rect x="${10 + c * 18}" y="${54 + r * 34}" width="10" height="20" fill="#F6E7D8" opacity=".85"/>`;
      g += `<rect x="${186 + c * 18}" y="${54 + r * 34}" width="10" height="20" fill="#F6E7D8" opacity=".85"/>`;
    }
    g += `<rect x="112" y="118" width="36" height="42" rx="2" fill="#3A2318"/>`;
    g += `<rect x="0" y="36" width="260" height="6" fill="${dark}"/>`;
    g += `</g>`;
    return g;
  }

  function palacio(x = 60, y = 90, s = 1) {
    // Fachada con revoque ajedrezado, pináculos góticos y cúpula descentrada (hacia la derecha)
    let g = `<g transform="translate(${x} ${y}) scale(${s})">`;
    g += `<defs><pattern id="chk${x}${y}" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#ECE8E1"/><rect width="6" height="6" fill="#5E6670"/><rect x="6" y="6" width="6" height="6" fill="#5E6670"/></pattern></defs>`;
    g += `<rect x="0" y="70" width="270" height="120" fill="url(#chk${x}${y})"/>`;
    // pináculos
    for (let i = 0; i < 7; i++) { const px = 8 + i * 42; g += `<path d="M${px} 70 L${px + 6} 46 L${px + 12} 70Z" fill="#4C535C"/>`; }
    // cuerpo de la cúpula (descentrado)
    g += `<rect x="178" y="40" width="64" height="40" fill="url(#chk${x}${y})"/>`;
    g += `<path d="M172 44 Q210 -14 248 44Z" fill="#7A3B2E"/>`;
    g += `<rect x="204" y="0" width="12" height="18" fill="#4C535C"/><path d="M204 0 L210 -12 L216 0Z" fill="#4C535C"/>`;
    // ventanas ojivales
    for (let r = 0; r < 2; r++) for (let c = 0; c < 6; c++) g += `<path d="M${16 + c * 42} ${118 + r * 38} v-18 q8 -12 16 0 v18z" fill="#2F3540" opacity=".85"/>`;
    g += `<path d="M118 190 v-36 q17 -22 34 0 v36z" fill="#2F3540"/>`;
    // eje central marcado
    g += `</g>`;
    return g;
  }

  function plaza() {
    let g = '';
    g += `<rect x="0" y="210" width="400" height="90" fill="#D9D2C5"/>`;
    for (let i = 0; i < 9; i++) g += `<line x1="${i * 50}" y1="210" x2="${i * 50 - 40}" y2="300" stroke="#C7BFB1" stroke-width="2"/>`;
    // pedestales genéricos con volúmenes abstractos (no representan obras concretas)
    [[70, 236], [160, 250], [250, 232], [330, 248]].forEach(([px, py]) => {
      g += `<rect x="${px - 14}" y="${py - 6}" width="28" height="22" fill="#9E9688"/>`;
      g += `<ellipse cx="${px}" cy="${py - 18}" rx="15" ry="13" fill="#4A3B2C"/>`;
    });
    return g;
  }

  function hero(kind) {
    const W = 400, H = 300;
    if (kind === 'welcome') {
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${sky('sw', '#0E2A55', '#3B5C8C', '#E8A065')}<rect width="${W}" height="${H}" fill="url(#sw)"/>
        
        ${mountains(210, '#2B3F63', .9)}${mountains(240, '#1F2E4A')}
        <g opacity=".95">${museo(20, 200, .38, '#8C4A33', '#5E3020')}${palacio(240, 178, .5)}</g>
        <rect x="0" y="262" width="${W}" height="40" fill="#141E30"/></svg>`;
    }
    if (kind === 'pb') {
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${sky('spb', '#5EA3E6', '#A9D0F5', '#F2E6D3')}<rect width="${W}" height="${H}" fill="url(#spb)"/>
        ${mountains(170, '#7FA27A', .7)}
        ${museo(-30, 108, .62)}${palacio(232, 88, .62)}${plaza()}</svg>`;
    }
    if (kind === 'ma') {
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${sky('sma', '#4C8FD9', '#9CC6F0', '#F3E3CC')}<rect width="${W}" height="${H}" fill="url(#sma)"/>
        ${mountains(150, '#7FA27A', .6)}${museo(25, 70, 1.35)}<rect x="0" y="286" width="${W}" height="14" fill="#D9D2C5"/></svg>`;
    }
    if (kind === 'pc') {
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${sky('spc', '#2F6FC4', '#8DBBEB', '#F0DCC0')}<rect width="${W}" height="${H}" fill="url(#spc)"/>
        ${mountains(150, '#7FA27A', .6)}${palacio(20, 64, 1.3)}<rect x="0" y="292" width="${W}" height="8" fill="#D9D2C5"/></svg>`;
    }
    return '';
  }

  // Contornos para alinear con la cámara (trazo ámbar). Son guías aproximadas:
  // deben recalcarse sobre fotos propias tomadas desde el punto de activación.
  function contour(kind) {
    if (kind === 'museo') {
      return `<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><path class="contour-path" d="M10 190 V70 H105 V40 H125 V30 H175 V40 H195 V70 H290 V190" fill="none"/></svg>`;
    }
    return `<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><path class="contour-path" d="M10 190 V95 H190 V75 Q222 10 254 75 V95 H290 V190" fill="none"/><path class="contour-path" d="M222 28 V14" fill="none"/></svg>`;
  }

  // Esquema en planta del Palacio para PC-02 (INTERPRETACIÓN: proporción documentada, forma no)
  function domePlan() {
    return `<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" class="dome-svg">
      <g id="ghosts">
        <rect class="ghost g1" x="20" y="20" width="140" height="90"/>
        <rect class="ghost g2" x="20" y="110" width="140" height="90"/>
        <rect class="ghost g3" x="160" y="20" width="140" height="90"/>
      </g>
      <rect class="built" x="160" y="110" width="140" height="90"/>
      <circle class="dome" cx="172" cy="122" r="14"/>
      <line class="axis axis-built" x1="230" y1="104" x2="230" y2="206"/>
      <line class="axis axis-dome" x1="172" y1="104" x2="172" y2="206"/>
      <text x="230" y="216" class="lbl">centro de lo construido</text>
    </svg>`;
  }

  function cabinet(shelves) {
    let s = `<svg viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg" class="cab-svg"><rect x="10" y="10" width="240" height="280" rx="10" fill="#6B4A32"/><rect x="22" y="22" width="216" height="256" rx="6" fill="#F6EFE6"/>`;
    shelves.forEach((_, i) => {
      const y = 30 + i * 50;
      s += `<g class="shelf" data-i="${i}"><rect x="28" y="${y}" width="204" height="44" rx="4" fill="#FFFFFF" stroke="#D8CBB9"/>`;
      // siluetas genéricas
      for (let k = 0; k < 4; k++) s += `<rect x="${42 + k * 48}" y="${y + 12 + (k % 2) * 4}" width="${18 + (k % 3) * 6}" height="${22 - (k % 2) * 4}" rx="${k % 2 ? 9 : 3}" fill="#C9B79F"/>`;
      s += `</g>`;
    });
    return s + `</svg>`;
  }

  const icons = {
    align: '<svg viewBox="0 0 24 24"><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 15l3-6 3 4 2-2 2 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    slide: '<svg viewBox="0 0 24 24"><path d="M3 12h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>',

    huella: '<svg viewBox="0 0 24 24"><rect x="4" y="6" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="7" y="9" width="14" height="10" rx="2" fill="currentColor" opacity=".25"/><path d="M4 11h14" stroke="currentColor" stroke-width="1.4"/></svg>',
    home: '<svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="currentColor"/></svg>',
    layers: '<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
    map: '<svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.8"/></svg>',
    info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    pin: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor" opacity=".2"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>',
    back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    arrow: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    soundOn: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>',
    cc: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="12" y="15.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" font-family="Arial">CC</text></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',

</script><script>/* CAPAS — app web (iPhone/Safari). Sin cuenta, sin ubicación, progreso solo en el teléfono. */
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const I = ART.icons;
const app = $('#app');

/* ---------- estado y almacenamiento local (con try/catch) ---------- */
const KEY = 'capas-v1';
const defaults = { onboarded: false, mode: null, audio: false, cc: true, huellas: {}, micros: {}, visited: {}, quiz: null };
let S = load();
function load() { try { return Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return Object.assign({}, defaults); } }
let storageOk = true;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { if (storageOk) { storageOk = false; toast('Tu avance no se guardará si cierras esta pestaña.'); } } }
const nHuellas = () => ['pb', 'ma', 'pc'].filter(k => S.huellas[k]).length;

/* ---------- utilidades ---------- */
let timers = [];
function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function toast(msg, ms = 2600) { const t = el(`<div class="toast" role="status">${esc(msg)}</div>`); document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function mount(node) { clearTimers(); stopSpeech(); $$('.screen', app).forEach(s => s.remove()); app.appendChild(node); node.scrollTop = 0; return node; }
function imgOr(key, fallbackHtml) { return IMAGES[key] ? `<img src="${IMAGES[key]}" alt="">` : fallbackHtml; }

/* ---------- sonido: efectos sintetizados + voz provisional ---------- */
let actx = null;
function beep(freq = 660, dur = .12, type = 'sine', vol = .08) {
  if (!S.audio) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();

  } catch (e) {}
}
const sfx = {
  ok: () => { beep(660, .1); setTimeout(() => beep(990, .14), 90); },
  tap: () => beep(520, .06, 'triangle'),
  err: () => beep(180, .18, 'sine', .07),
  bronze: (i) => beep(300 + i * 90, .35, 'triangle', .09),
  motif: (v = 0) => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f / (v ? 1.26 : 1), .22, 'sine', .07), i * 160))
};
let voice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    voice = ['es-CO', 'es-MX', 'es-US', 'es-419', 'es-ES'].map(l => vs.find(v => v.lang === l || v.lang.replace('_', '-') === l)).find(Boolean) || vs.find(v => /^es/i.test(v.lang)) || null;
  } catch (e) {}
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!S.audio || !('speechSynthesis' in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, '. '));
    if (voice) u.voice = voice; u.lang = voice ? voice.lang : 'es-CO'; u.rate = 1.0;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function stopSpeech() { try { speechSynthesis.cancel(); } catch (e) {} }
function pauseSpeech(p) { try { p ? speechSynthesis.pause() : speechSynthesis.resume(); } catch (e) {} }

/* ---------- cámara ---------- */
let stream = null, camFailed = false;
async function startCamera() {

    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false }),

/* ---------- orientación (alineación estable y aviso de movimiento) ---------- */
let ori = { beta: null, gamma: null, t: 0 }, oriSeen = false;

}

function heroArt(id) { const k = { pb: 'heroPB', ma: 'heroMA', pc: 'heroPC' }[id]; return IMAGES[k] ? `<img src="${IMAGES[k]}" alt="">` : `<div class="art">${ART.hero(id)}</div>`; }

/* --- alineador: estabilidad por giroscopio o confirmación manual --- */
function aligner(s, contourEl, meter, onAligned, o = {}) {
  let done = false, hist = [], start = Date.now();
  const bar = $('i', meter) || $('#amb', s), txt = $('span', meter);
  const manual = el(`<button class="btn sm" style="position:absolute;left:50%;transform:translateX(-50%);top:calc(47% + 36px);z-index:7;width:auto;padding:0 18px;height:40px">Ya coincide</button>`);
  const iv = setInterval(() => {
    if (done) return;
    const now = Date.now();
    if (oriSeen && now - ori.t < 800) {
      hist.push({ t: now, b: ori.beta, g: ori.gamma }); hist = hist.filter(h => now - h.t < 1500);
      const span = Math.max(...hist.map(h => h.b)) - Math.min(...hist.map(h => h.b)) + Math.max(...hist.map(h => h.g)) - Math.min(...hist.map(h => h.g));
      const covered = hist.length ? (now - hist[0].t) / 1500 : 0;
      const p = span < 3 ? Math.min(1, covered) : 0; if (bar) bar.style.width = (p * 100) + '%';
      if (p >= 1 && now - start > 1200) finish();
    }
    if (now - start > (o.quick ? 1500 : 2500) && !manual.isConnected) s.appendChild(manual);
    if (!o.quick && now - start > 20000 && o.onGiveUp && !s.querySelector('#gu')) {
      const g = el(`<button id="gu" class="btn sm light" style="position:absolute;left:16px;right:16px;top:calc(62px + var(--safe-t) + 40px);z-index:7;width:auto">¿No coincide? Ver la comparación sin cámara</button>`);
      s.appendChild(g); g.onclick = () => { clearInterval(iv); o.onGiveUp(); };
    }
  }, 120);
  timers.push(iv);
  manual.onclick = finish;
  function finish() {
    if (done) return; done = true; clearInterval(iv); manual.remove(); const g = $('#gu', s); if (g) g.remove();
    contourEl.classList.add('solid'); meter.classList.add('ok'); if (txt) txt.textContent = '✓ Alineado'; if (bar) bar.style.width = '100%';
    sfx.ok(); try { navigator.vibrate && navigator.vibrate(20); } catch (e) {}
    later(() => meter.remove(), 1200);
    // aviso si el teléfono se mueve mucho tras alinear
    const base = { b: ori.beta, g: ori.gamma };
    const watch = setInterval(() => { if (!oriSeen || base.b == null) return; const d = Math.abs(ori.beta - base.b) + Math.abs(ori.gamma - base.g); contourEl.classList.toggle('lost', d > 8); }, 300);
    timers.push(watch);
    onAligned();
  }
}
function alignUI(s, kind, text) {
  const ct = el(`<div class="contour">${ART.contour(kind)}</div>`); $('.stage', s).appendChild(ct);
  const am = el(`<div class="align-meter"><span>${esc(text || 'Mantén el teléfono estable')}</span><span class="bar"><i></i></span></div>`); s.appendChild(am);
  return { ct, am };
}

/* --- deslizador del tiempo --- */
function timeSlider(labels, onChange, discrete = false) {
  const max = discrete ? labels.length - 1 : 100;
  const node = el(`<div class="timeslider"><div class="labels">${labels.map((l, i) => `<span data-i="${i}" class="${i === 0 ? 'on' : ''}">${esc(l)}</span>`).join('')}</div><input type="range" min="0" max="${max}" step="1" value="0" aria-label="Deslizador del tiempo: ${labels.join(', ')}"></div>`);
  const r = $('input', node), api = { node, done: false };
  const upd = () => { const v = +r.value / max; r.style.setProperty('--p', (v * 100) + '%'); $$('.labels span', node).forEach((sp, i) => sp.classList.toggle('on', discrete ? i === +r.value : (i === 0 ? v < .5 : v >= .5))); onChange(discrete ? +r.value : v); };
  r.addEventListener('input', () => { if (discrete) { try { navigator.vibrate && navigator.vibrate(10); } catch (e) {} sfx.tap(); } upd(); });
  api.set = v => { r.value = v; upd(); };
  return api;
}

/* ---------- PB-02 y MA-02 comparar capas ---------- */
function sCompare(sc, opts) {
  const { s, cam, body, stage } = sceneShell(sc, opts);
  const multi = sc.layers.length > 2;
  // capa de archivo
  const arch = el(`<div class="archive-layer"></div>`); stage.insertBefore(arch, $('.vignette', stage));
  const paintLayer = L => {
    if (!L || !L.img) { arch.innerHTML = ''; return; }
    arch.innerHTML = IMAGES[L.img] ? `<img src="${IMAGES[L.img]}" alt="Foto de archivo ${L.img}">` :
      `<div class="pending">${I.photo}<b>Foto de archivo pendiente · ${L.img}</b><span>${esc(L.caption || L.title || '')}${L.year ? ' · ' + esc(L.year) : ''}<br>Se mostrará aquí, alineada con la fachada, cuando esté localizada y licenciada.</span></div>`;
  };
  let yearTag = null;
  const showYear = (txt) => { if (yearTag) yearTag.remove(); if (!txt) return; yearTag = el(`<div class="year-tag">${esc(txt)}</div>`); s.appendChild(yearTag); };
  const startCompare = () => {
    if (!multi) {
      const L = sc.layers[1]; paintLayer(L);
      body.innerHTML = `<p class="body" style="margin:0">Desliza hacia <b>ANTES</b>.</p>`;
      let played = false;
      const sl = timeSlider(['HOY', 'ANTES'], v => {
        arch.style.opacity = v;
        if (v > .5) { setSeal(s, 'archivo', IMAGES[L.img] ? (CREDITS[L.img] || 'crédito por confirmar') : 'pendiente'); } else setSeal(s, null);
        showYear(v > .95 ? `${L.year} · ${L.caption}` : null);
        if (v > .95 && !played) {
          played = true; sfx.ok();
          const out = el(`<div><div class="caption" style="background:#E6F7F5"><span class="who" style="color:var(--seal-sound)">${esc(sc.sound.label)}</span>${esc(sc.sound.desc)}</div>
            <p class="body"><b>${esc(sc.subtitle)}</b></p>${voCaption(sc.vo)}${microLink(sc.micro)}<div class="src">Fuentes: ${esc(sc.sources)}</div>${nextBtn(sc, opts)}</div>`);
          body.appendChild(out); wireMicro(s, sc); wireNext(s, sc, opts); speak(sc.vo);
          later(() => { if (+$('input', sl.node).value > 95) { arch.style.transition = 'opacity 1.5s'; arch.style.opacity = .5; later(() => arch.style.transition = '', 1600); } }, 9000);
        }
      });
      body.appendChild(sl.node);
    } else {
      // cuatro paradas: HOY · 2000 · 1987 · 1937
      const seen = new Set([0]);
      body.innerHTML = `<p class="body" style="margin:0">Desliza por las cuatro vidas del edificio.</p>`;
      const info = el(`<div id="inf"></div>`);
      const sl = timeSlider(sc.layers.map(l => l.label), i => {
        const L = sc.layers[i]; paintLayer(L); arch.style.opacity = L.img ? 1 : 0;
        setSeal(s, L.img ? 'archivo' : null, L.img ? (IMAGES[L.img] ? (CREDITS[L.img] || 'crédito por confirmar') : 'pendiente') : '');
        showYear(L.img ? `${L.label} · ${L.title}` : null);
        const first = !seen.has(i); seen.add(i);
        if (i === 2) { $('.stage', s).animate([{ opacity: 1 }, { opacity: .25 }, { opacity: 1 }], { duration: 600 }); }
        info.innerHTML = `<div class="caption"><b>${esc(L.title)}</b> ${esc(L.text || '')}</div>${(first || i === 0) && L.vo ? voCaption(L.vo) : ''}${L.micro ? microLink(L.micro) : ''}`;
        wireMicro(s, sc);
        if (first && L.vo) speak(L.vo);
        if (seen.size === 4 && !$('[data-next]', s)) { const t = el(`<div><div class="src">Fuentes: ${esc(sc.sources)}</div>${nextBtn(sc, opts)}</div>`); body.appendChild(t); wireNext(s, sc, opts); }
      }, true);
      body.appendChild(sl.node); body.appendChild(info);
      sl.set(0);
    }
  };
  if (cam) {
    body.innerHTML = `${sc.goto ? `<p class="body" style="margin:0 0 6px"><b>${esc(sc.goto)}</b></p>` : ''}<p class="body" style="margin:0">${esc(sc.alignText)}</p>`;
    const { ct, am } = alignUI(s, sc.contour, 'Mantén el teléfono estable');
    aligner(s, ct, am, () => startCompare(), { onGiveUp: () => runScene(sc.id, Object.assign({}, opts, { force2d: true })) });
  } else startCompare();
  fallbackNext(s, sc, opts, 40000);
}

/* ---------- PB-03 la oferta que creció ---------- */
function sCounter(sc, opts) {
  const { s, body } = sceneShell(sc, opts);
  // 23 posiciones esquemáticas (no levantadas en terreno)
  const pos = []; for (let i = 0; i < 23; i++) { const col = i % 6, row = Math.floor(i / 6); pos.push([10 + col * 15 + (row % 2) * 7, 26 + row * 18 + ((i * 7) % 5)]); }
  body.innerHTML = `<p class="body" style="margin:0 0 6px"><b>${esc(sc.pre)}</b></p><p class="body" style="margin:0">${esc(sc.prompt)}</p>
    <div class="plan"><span class="note">ESQUEMA · RECONSTRUCCIÓN · posiciones sin levantar en terreno</span>${pos.map(([x, y]) => `<i style="left:${x}%;top:${y}%"></i>`).join('')}</div>
    <div class="counter-row"><div class="odometer" id="od">10<small>esculturas</small></div><button class="plus pulse" id="pl" aria-label="Ver cómo creció la oferta">+</button></div>
    ${voCaption(sc.vo)}<div id="af"></div>${microLink(sc.micro)}`;
  wireMicro(s, sc); speak(sc.vo);
  let k = 0; const dots = $$('.plan i', s);
  const light = n => dots.forEach((d, i) => d.classList.toggle('on', i < n));
  light(10);
  $('#pl', s).onclick = () => {
    if (k >= sc.steps.length - 1) return;
    k++; const n = sc.steps[k]; sfx.bronze(k); light(n);
    $('#od', s).innerHTML = `${n}<small>esculturas</small>`; $('#od', s).animate([{ transform: 'translateY(6px)', opacity: .3 }, { transform: 'none', opacity: 1 }], { duration: 400 });
    if (k === sc.steps.length - 1) {
      $('#pl', s).classList.remove('pulse'); $('#pl', s).disabled = true; $('#pl', s).style.opacity = .4;

/* ---------- MA-01 / PC-01 puntos sobre la fachada ---------- */
function sHotspots(sc, opts) {
  const { s, cam, body, stage } = sceneShell(sc, opts);
  const show = () => {
    const holder = $('.contour', s) || (() => { const d = el(`<div class="contour" style="opacity:${cam ? 1 : 0}">${ART.contour(sc.contour)}</div>`); stage.appendChild(d); return d; })();
    const seen = new Set();
    const needed = sc.hotspots.filter(h => !h.micro).length;
    sc.hotspots.forEach((h, i) => {
      const r = holder.getBoundingClientRect(), sr = s.getBoundingClientRect();
      const b = el(`<button class="hotspot" aria-label="${esc(h.title)}" style="left:${r.left - sr.left + r.width * h.x / 100}px;top:${r.top - sr.top + r.height * h.y / 100}px">${h.micro ? '?' : '+'}</button>`);
      later(() => s.appendChild(b), 300 * i);
      b.onclick = () => {
        sfx.tap(); if (h.micro) return openMicro(h.micro, s);
        $$('.bubble', s).forEach(x => x.remove());
        b.classList.add('seen'); seen.add(i);
        const bub = el(`<div class="bubble" style="top:${Math.max(16, h.y > 60 ? 22 : 52)}%"><b>${esc(h.title)}</b>${esc(h.text)}</div>`);
        s.appendChild(bub); bub.onclick = () => bub.remove(); later(() => bub.remove(), 6000);
        if (seen.size >= needed) ready();

    });
    body.innerHTML = `${sc.labels ? sc.labels.map(l => `<div class="caption"><b>${esc(l.title)}</b> · ${esc(l.text)}</div>`).join('') : `<p class="body" style="margin:0">Toca los puntos para mirarlo de cerca.</p>`}${voCaption(sc.vo)}<div id="rd"></div>`;
    speak(sc.vo);

  let isReady = false;

  if (cam) {

    const { ct, am } = alignUI(s, sc.contour);
    aligner(s, ct, am, show, { onGiveUp: () => runScene(sc.id, Object.assign({}, opts, { force2d: true })) });
  } else later(show, 50);

}

/* ---------- MA-03 ordenar ---------- */
function sOrder(sc, opts) {
  const { s, body } = sceneShell(sc, opts);
  const shuffled = sc.cards.slice().sort((a, b) => (a.id > b.id ? 1 : -1)).reverse(); shuffled.push(shuffled.shift());
  body.innerHTML = `<p class="body" style="margin:0">${esc(sc.prompt)}</p>
    <div class="slots">${sc.slots.map(y => `<div class="slot" data-slot="${y}"><span class="y">${y}</span></div>`).join('')}</div>
    <div class="cardsel">${shuffled.map(c => `<button data-card="${c.id}">${esc(c.text)}</button>`).join('')}</div><div id="hint"></div><div id="dn"></div>${microLink(sc.micro)}`;
  wireMicro(s, sc); speak(sc.voStart);
  let picked = null, errors = {}, placed = 0;
  const pick = b => { $$('.cardsel button', s).forEach(x => x.classList.toggle('picked', x === b)); picked = b; $$('.slot', s).forEach(sl => sl.classList.toggle('ready', !!b && !sl.querySelector('.placed'))); };
  const tryPlace = (cardBtn, slotEl) => {
    const c = sc.cards.find(x => x.id === cardBtn.dataset.card);
    if (slotEl.querySelector('.placed')) return;
    if (c.slot === slotEl.dataset.slot) {
      sfx.ok(); slotEl.appendChild(el(`<div class="placed">${esc(c.text)}</div>`)); cardBtn.classList.add('used'); pick(null); placed++;
      $('#hint', s).innerHTML = '';
      if (placed === sc.cards.length) {
        sfx.motif(); $('.slots', s).animate([{ filter: 'brightness(1)' }, { filter: 'brightness(1.15)' }, { filter: 'brightness(1)' }], { duration: 800 });
        $('#dn', s).innerHTML = `<div class="fb good">${esc(sc.done)}</div>${voCaption(sc.vo)}<div class="src">Fuentes: ${esc(sc.sources)}</div>${nextBtn(sc, opts)}`; wireNext(s, sc, opts); speak(sc.vo);
      }
    } else {
      sfx.err(); slotEl.classList.remove('shake'); void slotEl.offsetWidth; slotEl.classList.add('shake');
      errors[c.id] = (errors[c.id] || 0) + 1;
      $('#hint', s).innerHTML = `<p class="small" style="color:#D0454A">${esc(sc.hint)}</p>`;
      if (errors[c.id] >= 2) { const good = $(`.slot[data-slot="${c.slot}"]`, s); good.animate([{ background: '#EAF2FE' }, { background: '#CFE2FF' }, { background: '#EAF2FE' }], { duration: 500, iterations: 3 }); }
    }
  };
  $$('.cardsel button', s).forEach(b => {
    b.onclick = () => pick(picked === b ? null : b);
    // arrastre con el dedo
    b.addEventListener('pointerdown', e => {
      const sx = e.clientX, sy = e.clientY; let ghost = null;
      const move = ev => { if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) { ghost = el(`<div class="drag-ghost">${esc(b.textContent)}</div>`); document.body.appendChild(ghost); pick(b); } if (ghost) { ghost.style.left = (ev.clientX - 60) + 'px'; ghost.style.top = (ev.clientY - 20) + 'px'; } };
      const up = ev => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); if (ghost) { ghost.remove(); const t = document.elementFromPoint(ev.clientX, ev.clientY); const sl = t && t.closest('.slot'); if (sl) tryPlace(b, sl); } };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    });
  });
  $$('.slot', s).forEach(sl => sl.onclick = () => { if (picked) tryPlace(picked, sl); });
  fallbackNext(s, sc, opts, 60000);
}

    <h1 class="h2">Recuperaste ${first} de 9 capas.</h1>${rec ? `<p class="body" style="color:#0E9B70;font-weight:700">+${rec} recuperadas al repasar</p>` : ''}
    <h3 class="h3" style="margin-top:18px">Lo que ahora sabes</h3>

    <div class="caption"><b>Sigue explorando:</b> entra al Museo de Antioquia a ver los murales de Pedro Nel Gómez · entra al Palacio de la Cultura (Medellín.Travel indica entrada libre) · camina al Parque Berrío, junto a la estación del Metro del mismo nombre.</div>

  speak(VO_BV.results); sfx.motif();
  $('#hm', s).onclick = showHome; $('#mi', s).onclick = () => { showHome(); later(() => $('#micro') && $('#micro').scrollIntoView(), 100); }; $('#cr', s).onclick = showInfo;
  $('#sh', s).onclick = () => shareCard(first);
}
async function shareCard(score) {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 1350); grd.addColorStop(0, '#0E2A55'); grd.addColorStop(1, '#176FF2'); g.fillStyle = grd; g.fillRect(0, 0, 1080, 1350);
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = '160px "Kaushan Script", cursive'; g.fillText('Capas', 540, 300);
  g.font = '600 40px Montserrat, sans-serif'; g.fillText('EL CENTRO QUE NO SE VE', 540, 380);
  g.font = '700 64px Montserrat, sans-serif'; g.fillText(`Recuperé ${score} de 9 capas`, 540, 560);
  g.font = '500 40px Montserrat, sans-serif'; g.fillText('del centro de Medellín', 540, 630);
  [['HUELLA 1 · PLAZA BOTERO', '1998–2001', '#5AA0FF'], ['HUELLA 2 · MUSEO DE ANTIOQUIA', '1937 · 1987 · 2000', '#F2A93B'], ['HUELLA 3 · PALACIO DE LA CULTURA', '1920–1938', '#59647A']].forEach(([a, b, col], i) => {
    const y = 760 + i * 170; g.fillStyle = col; roundRect(g, 120, y, 840, 140, 36); g.fill(); g.fillStyle = '#fff'; g.textAlign = 'left';
    g.font = '700 30px Montserrat, sans-serif'; g.fillText(a, 170, y + 56); g.font = '700 46px Montserrat, sans-serif'; g.fillText(b, 170, y + 112); g.textAlign = 'center';
  });
  c.toBlob(async blob => {
    const file = new File([blob], 'capas-medellin.png', { type: 'image/png' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'CAPAS' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'capas-medellin.png'; a.click();
  });
  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
}

let pendingStop = null;
function boot() {
  let p = null;
  try { const u = new URL(location.href); p = u.searchParams.get('p') || (location.hash.match(/^#(?:p=)?(pb|ma|pc)$/) || [])[1]; } catch (e) {}
  if (p && !STOPS[p]) p = null;
  if (!S.onboarded) { pendingStop = p; showWelcome(); }
  else if (p) showStop(p, true);
  else showHome();
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopSpeech(); } });
}
window.CAPAS = { runScene, showStop, showHome, openMicro, startQuiz, quizQ, showResults, state: () => S };
boot();
